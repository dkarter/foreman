[tools]
"aube" = "1.29.1"
"github:crate-ci/committed" = "latest"
dprint = "latest"
fnox = "latest"
gitleaks = "latest"
go = "1.25.12"
lefthook = "latest"
pitchfork = "latest"
node = "24.18.0"
"github:dmno-dev/varlock" = "1.13.0"

[hooks]
postinstall = "aube install && lefthook install"

[tasks.fmt]
description = "Formats all supported files"
run = "dprint fmt"

[tasks.fmt-check]
description = "Checks formatting and fails on differences"
run = "dprint check"

[tasks.test]
description = "Runs the test suite"
run = "go test ./... && aube run check"

[tasks.build-web]
description = "Type-checks and bundles the Preact kiosk UI"
run = "aube run check && aube run build"

[tasks.build]
description = "Builds the lightweight Foreman server"
depends = ["build-web"]
run = "mkdir -p bin && go build -trimpath -ldflags='-s -w' -o bin/foreman ."

[tasks.build-status]
description = "Builds the native macOS Foreman menu bar app"
run = '''mkdir -p bin/Foreman.iconset
swiftc -O -parse-as-library -target arm64-apple-macos13.0 -framework AppKit -framework Foundation macos/ForemanStatus.swift -o bin/foreman-status
sips -z 16 16 assets/foreman-app-icon.png --out bin/Foreman.iconset/icon_16x16.png >/dev/null
sips -z 32 32 assets/foreman-app-icon.png --out bin/Foreman.iconset/icon_16x16@2x.png >/dev/null
sips -z 32 32 assets/foreman-app-icon.png --out bin/Foreman.iconset/icon_32x32.png >/dev/null
sips -z 64 64 assets/foreman-app-icon.png --out bin/Foreman.iconset/icon_32x32@2x.png >/dev/null
sips -z 128 128 assets/foreman-app-icon.png --out bin/Foreman.iconset/icon_128x128.png >/dev/null
sips -z 256 256 assets/foreman-app-icon.png --out bin/Foreman.iconset/icon_128x128@2x.png >/dev/null
sips -z 256 256 assets/foreman-app-icon.png --out bin/Foreman.iconset/icon_256x256.png >/dev/null
sips -z 512 512 assets/foreman-app-icon.png --out bin/Foreman.iconset/icon_256x256@2x.png >/dev/null
sips -z 512 512 assets/foreman-app-icon.png --out bin/Foreman.iconset/icon_512x512.png >/dev/null
cp assets/foreman-app-icon.png bin/Foreman.iconset/icon_512x512@2x.png
iconutil -c icns bin/Foreman.iconset -o bin/Foreman.icns'''

[tasks.build-satellite]
description = "Builds the Raspberry Pi resource reporter"
run = "mkdir -p bin && GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o bin/foreman-linux-arm64 ."

[tasks.serve]
description = "Runs Foreman on the host"
run = "go run ."

[tasks.install-host]
description = "Builds and installs Foreman as a macOS user service"
depends = ["build", "build-status"]
run = '''mkdir -p "$HOME/Applications/Foreman.app/Contents/MacOS" "$HOME/Applications/Foreman.app/Contents/Resources"
cp bin/foreman-status "$HOME/Applications/Foreman.app/Contents/MacOS/Foreman"
cp bin/foreman "$HOME/Applications/Foreman.app/Contents/Resources/foreman-server"
cp macos/Info.plist "$HOME/Applications/Foreman.app/Contents/Info.plist"
cp bin/Foreman.icns "$HOME/Applications/Foreman.app/Contents/Resources/Foreman.icns"
cp assets/foreman-menubar-for-light.png assets/foreman-menubar-for-dark.png "$HOME/Applications/Foreman.app/Contents/Resources/"
cp web/assets/herdr.png "$HOME/Applications/Foreman.app/Contents/Resources/herdr.png"
sed "s|__HOME__|$HOME|g" deploy/dev.herdr.foreman.plist > "$HOME/Library/LaunchAgents/dev.herdr.foreman.plist"
sed "s|__HOME__|$HOME|g" deploy/dev.herdr.foreman-status.plist > "$HOME/Library/LaunchAgents/dev.herdr.foreman-status.plist"
launchctl bootout "gui/$UID/dev.herdr.foreman" >/dev/null 2>&1 || true
launchctl bootout "gui/$UID/dev.herdr.foreman-status" >/dev/null 2>&1 || true
launchctl bootstrap "gui/$UID" "$HOME/Library/LaunchAgents/dev.herdr.foreman.plist"
launchctl bootstrap "gui/$UID" "$HOME/Library/LaunchAgents/dev.herdr.foreman-status.plist"'''

[tasks.install-kiosk]
description = "Installs the Foreman kiosk, desktop launcher, and Pi reporter"
depends = ["build-satellite"]
run = '''target="${FOREMAN_SSH_TARGET:-foreman}"
ssh "$target" 'command -v avahi-browse >/dev/null 2>&1 || (sudo -n apt-get update -qq && sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq avahi-utils)'
ssh "$target" 'mkdir -p "$HOME/.config/autostart" "$HOME/.config/systemd/user" "$HOME/.local/bin" "$HOME/.local/share/icons/hicolor/512x512/apps" "$HOME/Desktop"'
scp bin/foreman-linux-arm64 "$target":.local/bin/foreman.new
scp deploy/foreman-satellite.service "$target":.config/systemd/user/foreman-satellite.service
scp deploy/foreman-kiosk.desktop "$target":.config/autostart/foreman-kiosk.desktop
scp deploy/foreman-kiosk.desktop "$target":Desktop/Foreman.desktop
scp web/assets/herdr.png "$target":.local/share/icons/hicolor/512x512/apps/foreman.png
ssh "$target" 'systemctl --user stop foreman-satellite.service >/dev/null 2>&1 || true'
ssh "$target" 'mv "$HOME/.local/bin/foreman.new" "$HOME/.local/bin/foreman" && chmod +x "$HOME/.local/bin/foreman" "$HOME/Desktop/Foreman.desktop" && systemctl --user daemon-reload && systemctl --user enable --now foreman-satellite.service'
ssh "$target" 'gio set "$HOME/Desktop/Foreman.desktop" metadata::trusted true >/dev/null 2>&1 || true'
ssh "$target" 'pkill -f "[c]hromium.*--kiosk.*(127\\.0\\.0\\.1:4041|air\\.local:4040)" >/dev/null 2>&1 || true' '''

[tasks.ssh]
description = "Opens an SSH console on the Raspberry Pi"
run = "ssh foreman"

[tasks.vnc]
description = "Forwards local port 5900 to Foreman's local-only VNC server"
run = "ssh -N -L 5900:127.0.0.1:5900 foreman"

[tasks.vnc-open]
description = "Opens Foreman in TigerVNC over SSH"
run = '''if ! nc -z 127.0.0.1 5900; then
  ssh -fN -o ExitOnForwardFailure=yes -L 5900:127.0.0.1:5900 foreman
fi
open -a TigerVNC --args localhost::5900'''
